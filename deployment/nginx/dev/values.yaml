# Default values for backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: feshar92/sonnen-task
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ${{ github.sha }}
  # secrets:
  #   - name: secret-key

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: False
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
#LoadBalancer
#ClusterIP
service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: False
  className: "sonnen-nginx"
  annotations: {
    Project         :    sonnen-project,
    ManagedBy       :    mohammedfeshar@gmail.com,
    git_repo        :    https://github.com/Mohammed-Feshar/sonnen-nginx-deployment-task,
    Environment     :    dev,
    TaggingVersion  :    V1.0,
  }
  hosts:
  - host: 
    paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonnen-nginx-dev
            port:
              number: 8001
  tls:
    - hosts:
        - 
      secretName: 

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: True
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

