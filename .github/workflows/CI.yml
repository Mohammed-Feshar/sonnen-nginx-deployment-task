# This workflow will build and deploy a custom nginx container image on k3d on DEV ENV
name: Dev Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
env:
  environment: 'dev'

jobs:
  build:
    name: BUILD IMAGE
    runs-on: ubuntu-latest
    environment: dev
    steps:
     # official Checkout action.
     - name: Check out code
       uses: actions/checkout@v3
     - name: Log in to Docker Hub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

     - name: Build, tag, and push image to Docker Hub
       env:
        DOCKER_REPOSITORY: sonnen-${{env.environment}}-task
        IMAGE_TAG:  ${{ github.sha }}
       run: |
          docker build --no-cache -t feshar92/$DOCKER_REPOSITORY:$IMAGE_TAG .
          docker push feshar92/$DOCKER_REPOSITORY:$IMAGE_TAG

  deploy:
      name: DEPLOY IMAGE
      needs: build
      environment: dev
      runs-on: ubuntu-latest
      steps:
        - name: Check out code
          uses: actions/checkout@v4