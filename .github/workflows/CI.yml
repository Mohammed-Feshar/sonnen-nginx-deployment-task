# This workflow will build and deploy a custom nginx container image on k3d on DEV ENV
name: Dev Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
env:
  environment: 'dev'

jobs:
  build:
    name: BUILD IMAGE
    runs-on: ubuntu-latest
    environment: dev
    steps:
     # official Checkout action.
     - name: Check out code
       uses: actions/checkout@v3
     - name: Log in to Docker Hub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

     - name: Build, tag, and push image to Docker Hub
       env:
        DOCKER_REPOSITORY: sonnen-${{env.environment}}-task
        IMAGE_TAG:  ${{ github.sha }}
       run: |
          docker build --no-cache -t feshar92/$DOCKER_REPOSITORY:$IMAGE_TAG .
          docker push feshar92/$DOCKER_REPOSITORY:$IMAGE_TAG

  deploy:
      name: DEPLOY IMAGE
      needs: build
      environment: dev
      runs-on: ubuntu-latest
      # container:
      #   image: hashicorp/terraform:1.6.6
      steps:
        - name: Check out code
          uses: actions/checkout@v4
        - name: Set up Terraform
          uses: hashicorp/setup-terraform@v1
          with:
            terraform_version: 1.6.6  # Use the version you need
        - name: Install k3d
          run: |
            curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
  
        - name: Create k3d cluster
          run: |
            if k3d cluster list | grep -q "^sonnen-k3d-cluster"; then
              echo "Cluster already exists"
            else
              echo "Cluster does not exist"
              k3d cluster create sonnen-k3d-cluster 
            fi
        - name: Write kubeconfig
          run: |
            mkdir -p /root/.kube
            cp "$(k3d kubeconfig write sonnen-k3d-cluster)" /root/.kube/config
        - name: Terraform fmt
          run: |
            cd terraform
            terraform fmt
            terraform --version
          continue-on-error: false
        - name: Terraform helm Init
          run: |
            cd terraform
            terraform init
        - name: Terraform helm Plan
          run: |
            cd terraform
            terraform plan  -no-color
          continue-on-error: false
        - name: Terraform helm Apply
          if: github.ref == 'refs/heads/main'
          run: |
            cd terraform
            terraform apply -auto-approve 
        - name: Install kubectl
          run: |
            KUBECTL_VERSION="v1.29.0"
            curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            chmod +x kubectl
            mv kubectl /usr/local/bin/
            kubectl version --client
            kubectl get pods -n dev
